<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAN Text-to-Image Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <h1>GAN Text-to-Image Studio</h1>
      <p class="subtitle">
        Enter a prompt and generate an AI image from your text.
      </p>

      <form id="prompt-form" class="prompt-form">
        <textarea
          id="prompt"
          name="prompt"
          rows="3"
          placeholder="Example: futuristic city floating above clouds at sunrise"
          required
        ></textarea>
        <button type="submit" id="generate-btn">Generate Image</button>
      </form>

      <p id="status" class="status" aria-live="polite"></p>

      <section class="image-panel">
        <img id="result-image" alt="Generated result" hidden />
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
